name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        dependencies: [highest]
        include:
          # `composer.lock` is not committed, so every leg above resolves the
          # NEWEST release each constraint allows — `filament/filament: ^5.0`
          # is never exercised anywhere near 5.0. This leg is the other end.
          - php: '8.2'
            dependencies: lowest

    name: PHP ${{ matrix.php }} (${{ matrix.dependencies }} deps)

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: |
          if [ "${{ matrix.dependencies }}" = "lowest" ]; then
            composer update --prefer-lowest --prefer-stable --prefer-dist --no-interaction --no-progress
          else
            composer update --prefer-dist --no-interaction --no-progress
          fi

      - name: Run tests
        run: vendor/bin/phpunit

  databases:
    runs-on: ubuntu-latest
    name: PHP 8.4 on ${{ matrix.db }}

    strategy:
      fail-fast: false
      matrix:
        db: [mysql, pgsql]

    # The package ships hand-written SQL — `scopeTreeOrdered()` builds its
    # ORDER BY through the connection grammar — plus migrations written around
    # driver behaviour: `after()` is MySQL-only, `$withinTransaction = false`
    # exists because PostgreSQL aborts a transaction on a failed statement, and
    # `mediumText` is chosen because MySQL's TEXT stops at 64 KB. SQLite
    # tolerates shapes MySQL rejects, so the SQLite legs above cannot answer for
    # any of it.
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: testing
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -psecret"
          --health-interval=5s --health-timeout=5s --health-retries=20

      pgsql:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testing
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: testing
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U testing -d testing"
          --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: intl, pdo_sqlite, pdo_mysql, pdo_pgsql
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        env:
          TOPBAR_TEST_DB: ${{ matrix.db }}
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ matrix.db == 'mysql' && '3306' || '5432' }}
          DB_DATABASE: testing
          DB_USERNAME: ${{ matrix.db == 'mysql' && 'root' || 'testing' }}
          DB_PASSWORD: secret
        run: vendor/bin/phpunit

  no-intl:
    runs-on: ubuntu-latest
    name: PHP 8.4 without ext-intl

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # composer.json does not require ext-intl and the code guards both
      # `idn_to_ascii` call sites with function_exists(), so an install without
      # it is supported — and until this leg existed, the false branch of those
      # guards had never run anywhere. Dropping either guard is a fatal on every
      # panel page for those installs.
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: ':intl, pdo_sqlite'
          coverage: none

      - name: Fail if ext-intl slipped in
        run: |
          php -r 'exit(function_exists("idn_to_ascii") ? 1 : 0);'

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress --ignore-platform-req=ext-intl

      - name: Run tests
        run: vendor/bin/phpunit

  quality:
    runs-on: ubuntu-latest
    name: Code quality (lint + static analysis)

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: intl, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Check code style (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (PHPStan)
        run: vendor/bin/phpstan analyse --no-progress
